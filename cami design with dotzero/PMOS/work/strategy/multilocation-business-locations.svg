<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 630" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Workspace, business, location with config split</title>
<desc>A workspace holds exactly one business, Chaps and Co. That business contains many location branches such as Marina, JVC and Downtown plus six more, nine in total. The business sets once, shared by all branches: clients, team members, catalog, marketing, stored value, business name, currency, tax method, languages and links. Each location has its own: assigned staff, calendar and hours, services and prices, stock, reports, till and payout, booking page, WhatsApp number, billing and VAT, tax defaults, receipt numbers and business types.</desc>
<style>
text{fill:#2c2c2a}
.t{font-size:14px}
.ts{font-size:12px}
.th{font-size:14px;font-weight:500}
.c-gray>rect{fill:#f1efe8;stroke:#5f5e5a}
.c-gray text{fill:#2c2c2a}
.c-teal>rect{fill:#e1f5ee;stroke:#0f6e56}
.c-teal text{fill:#085041}
.c-purple>rect{fill:#eeedfe;stroke:#534ab7}
.c-purple text{fill:#3c3489}
.box{fill:#fbfbfa;stroke:#b4b2a9}
</style>

<rect class="box" x="270" y="16" width="140" height="44" rx="10"/>
<text class="th" x="340" y="38" text-anchor="middle">Workspace</text>
<text class="ts" x="340" y="54" text-anchor="middle">holds one business</text>

<line x1="340" y1="60" x2="340" y2="84" stroke="#888780" stroke-width="1.5"/>

<g class="c-gray"><rect x="250" y="84" width="180" height="52" rx="10"/><text class="th" x="340" y="108" text-anchor="middle">Chaps &amp; Co</text><text class="ts" x="340" y="126" text-anchor="middle">the business</text></g>

<line x1="340" y1="136" x2="340" y2="178" stroke="#888780" stroke-width="1.5"/>
<line x1="105" y1="178" x2="573" y2="178" stroke="#888780" stroke-width="1.5"/>
<line x1="105" y1="178" x2="105" y2="196" stroke="#888780" stroke-width="1.5"/>
<line x1="261" y1="178" x2="261" y2="196" stroke="#888780" stroke-width="1.5"/>
<line x1="417" y1="178" x2="417" y2="196" stroke="#888780" stroke-width="1.5"/>
<line x1="573" y1="178" x2="573" y2="196" stroke="#888780" stroke-width="1.5"/>

<g class="c-purple"><rect x="40" y="196" width="130" height="46" rx="8"/><text class="th" x="105" y="218" text-anchor="middle">Marina</text><text class="ts" x="105" y="234" text-anchor="middle">a location</text></g>
<g class="c-purple"><rect x="196" y="196" width="130" height="46" rx="8"/><text class="th" x="261" y="218" text-anchor="middle">JVC</text><text class="ts" x="261" y="234" text-anchor="middle">a location</text></g>
<g class="c-purple"><rect x="352" y="196" width="130" height="46" rx="8"/><text class="th" x="417" y="218" text-anchor="middle">Downtown</text><text class="ts" x="417" y="234" text-anchor="middle">a location</text></g>
<g class="c-gray"><rect x="508" y="196" width="130" height="46" rx="8"/><text class="th" x="573" y="218" text-anchor="middle">+6 more</text><text class="ts" x="573" y="234" text-anchor="middle">9 in total</text></g>

<rect class="box" x="40" y="262" width="600" height="110" rx="12"/>
<text class="th" x="58" y="284">The business sets once, shared by all branches</text>
<g class="c-teal"><rect x="58" y="296" width="80" height="28" rx="8"/><text class="ts" x="98" y="314" text-anchor="middle">Clients</text></g>
<g class="c-teal"><rect x="148" y="296" width="124" height="28" rx="8"/><text class="ts" x="210" y="314" text-anchor="middle">Team members</text></g>
<g class="c-teal"><rect x="282" y="296" width="86" height="28" rx="8"/><text class="ts" x="325" y="314" text-anchor="middle">Catalog</text></g>
<g class="c-teal"><rect x="378" y="296" width="96" height="28" rx="8"/><text class="ts" x="426" y="314" text-anchor="middle">Marketing</text></g>
<g class="c-teal"><rect x="484" y="296" width="110" height="28" rx="8"/><text class="ts" x="539" y="314" text-anchor="middle">Stored value</text></g>
<g class="c-teal"><rect x="58" y="330" width="80" height="28" rx="8"/><text class="ts" x="98" y="348" text-anchor="middle">Name</text></g>
<g class="c-teal"><rect x="148" y="330" width="100" height="28" rx="8"/><text class="ts" x="198" y="348" text-anchor="middle">Currency</text></g>
<g class="c-teal"><rect x="258" y="330" width="110" height="28" rx="8"/><text class="ts" x="313" y="348" text-anchor="middle">Tax method</text></g>
<g class="c-teal"><rect x="378" y="330" width="110" height="28" rx="8"/><text class="ts" x="433" y="348" text-anchor="middle">Languages</text></g>
<g class="c-teal"><rect x="498" y="330" width="90" height="28" rx="8"/><text class="ts" x="543" y="348" text-anchor="middle">Links</text></g>

<rect class="box" x="40" y="390" width="600" height="188" rx="12"/>
<text class="th" x="58" y="414">Each location has its own</text>
<g class="c-purple"><rect x="58" y="426" width="124" height="28" rx="8"/><text class="ts" x="120" y="444" text-anchor="middle">Appointments</text></g>
<g class="c-purple"><rect x="190" y="426" width="118" height="28" rx="8"/><text class="ts" x="249" y="444" text-anchor="middle">Assigned staff</text></g>
<g class="c-purple"><rect x="316" y="426" width="124" height="28" rx="8"/><text class="ts" x="378" y="444" text-anchor="middle">Opening hours</text></g>
<g class="c-purple"><rect x="448" y="426" width="150" height="28" rx="8"/><text class="ts" x="523" y="444" text-anchor="middle">Assigned services</text></g>
<g class="c-purple"><rect x="58" y="464" width="90" height="28" rx="8"/><text class="ts" x="103" y="482" text-anchor="middle">Stock</text></g>
<g class="c-purple"><rect x="156" y="464" width="130" height="28" rx="8"/><text class="ts" x="221" y="482" text-anchor="middle">Till + payout</text></g>
<g class="c-purple"><rect x="294" y="464" width="130" height="28" rx="8"/><text class="ts" x="359" y="482" text-anchor="middle">Booking page</text></g>
<g class="c-purple"><rect x="432" y="464" width="170" height="28" rx="8"/><text class="ts" x="517" y="482" text-anchor="middle">WhatsApp number</text></g>
<g class="c-purple"><rect x="58" y="502" width="130" height="28" rx="8"/><text class="ts" x="123" y="520" text-anchor="middle">Business type</text></g>
<g class="c-purple"><rect x="196" y="502" width="100" height="28" rx="8"/><text class="ts" x="246" y="520" text-anchor="middle">Address</text></g>
<g class="c-purple"><rect x="304" y="502" width="130" height="28" rx="8"/><text class="ts" x="369" y="520" text-anchor="middle">Contact info</text></g>
<g class="c-purple"><rect x="442" y="502" width="160" height="28" rx="8"/><text class="ts" x="522" y="520" text-anchor="middle">Invoicing + VAT</text></g>
<g class="c-purple"><rect x="58" y="540" width="120" height="28" rx="8"/><text class="ts" x="118" y="558" text-anchor="middle">Tax defaults</text></g>
<g class="c-purple"><rect x="188" y="540" width="150" height="28" rx="8"/><text class="ts" x="263" y="558" text-anchor="middle">Receipt numbers</text></g>
<g class="c-purple"><rect x="348" y="540" width="100" height="28" rx="8"/><text class="ts" x="398" y="558" text-anchor="middle">Tipping</text></g>
<text class="ts" x="40" y="600" fill="#5f5e5a">Calendar and reports are views: business-wide, filterable by location.</text>
<text class="ts" x="40" y="618" fill="#5f5e5a">The appointments and money underneath are per branch.</text>
</svg>
